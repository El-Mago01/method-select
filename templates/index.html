{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
        <h1>Project Method Selection Tool</h1>
        <form action="/recommend" method="post">
            <label for="project_name">Project Name:</label>
            <input type="text" id="project_name" name="project_name" required>
        
            <label for="project_leader">Project Leader:</label>
            <input type="text" id="project_leader" name="project_leader" required>
        
            {% for param in parameters %}
                <label for="{{ param.id }}">{{ param.question }}:</label>
                {% if param.type == 'select' %}
                    <select id="{{ param.id }}" name="{{ param.id }}" required>
                        {% for option in param.options %}
                            <option value="{{ option }}" {% if data and data.get(param.id) == option %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                {% elif param.type == 'number' %}
                    <input type="number" id="{{ param.id }}" name="{{ param.id }}" min="{{ param.min }}" max="{{ param.max }}" value="{{ data[param.id] if data and data.get(param.id) else '' }}" required>
                {% endif %}
            {% endfor %}
            <input type="hidden" name="level" value="{{ level }}">
            <button type="submit">Get Recommendation</button>
        </form>
{% endblock %}
