<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Method Selection Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="{{ url_for('index') }}">Get a recommendation</a></li>
            <li><a href="{{ url_for('previous_recommendations') }}">Previous Recommendations</a></li>
            <li><a href="{{ url_for('list_all_recommendations') }}">list all available recommendations</a></li>

            <li><a href="{{ url_for('update_rules') }}">Update Rules</a></li>
        </ul>
    </div>
    <div class="container">
        {% block content %}{% endblock %}

</html>
