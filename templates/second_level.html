<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Level Questions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Second Level Questions</h1>
        <p>Based on your first level inputs, the recommended method is: <strong>{{ method }}</strong></p>
        <form action="/second_recommend" method="post">
            <input type="hidden" name="method" value="{{ method }}">
            <input type="hidden" name="first_level_id" value="{{ first_level_id }}">
            {% for param in parameters %}
                <label for="{{ param.name }}">{{ param.name.replace('_', ' ').capitalize() }}:</label>
                {% if param.type == 'select' %}
                    <select id="{{ param.name }}" name="{{ param.name }}" required>
                        {% for option in param.options %}
                            <option value="{{ option }}" {% if data.get(param.name) == option %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                {% elif param.type == 'number' %}
                    <input type="number" id="{{ param.name }}" name="{{ param.name }}" min="{{ param.min }}" max="{{ param.max }}" value="{{ data.get(param.name, '') }}" required>
                {% endif %}
            {% endfor %}
            <div class="form-actions">
                <button type="submit">Get Final Recommendation</button>
                <button type="button" onclick="document.getElementById('back-form').submit();">Back</button>
            </div>
        </form>
        <form id="back-form" action="/second_level_back" method="post">
            <input type="hidden" name="method" value="{{ method }}">
        </form>
    </div>
</body>
</html>
