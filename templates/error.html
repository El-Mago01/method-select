{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
        <h1>Missing rules</h1>
        <p>{{ message }}</p>
        <p>Please contact the C2C COP to update the rules in the json files.</p>
        <div class="button-container">
            <form action="{{ url_for('back') }}" method="post" class="inline-form">
                <input type="hidden" name="level" value="{{ level }}">
                <button type="submit" class="button">Back</button>
            </form>
        </div>
{% endblock %}
