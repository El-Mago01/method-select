<!-- HTML template for second-level recommendations specific to Scenario 1 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Project Methods</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="panel">
            <h2>Agile Project Methods</h2>
            <p>Please select the specific Agile method:</p>
            <form action="/recommend_level2" method="post">
                <label for="knowledge_of_agile_methods">Agile Method:</label>
                <select id="knowledge_of_agile_methods" name="knowledge_of_agile_methods" required>
                    <option value="Kanban">Kanban</option>
                    <option value="XP Programming">XP Programming</option>
                    <option value="Scrum">Scrum</option>
                </select>
                <button type="submit">Get Recommendation</button>
            </form>
        </div>
    </div>
</body>
</html>
