{% extends "base.html" %}

{% block title %}Unique Recommendations{% endblock %}

{% block content %}
<h1>All Unique Recommendations</h1>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Recommendation</th>
                <th>Details</th>
                <th>Contact</th>
            </tr>
        </thead>
        <tbody>
            {% for rec in recommendations %}
            <tr>
                <td>{{ rec.recommendation }}</td>
                <td>{{ rec.details }}</td>
                <td>{{ rec.contact }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<div class="button-container">
    <a href="{{ url_for('index') }}" class="button">Return to Home</a>
</div>
{% endblock %}
